# GENERATED: tools/rfcsync.py split writes _quarto.yml from this template.
# Edit this template, never _quarto.yml. The chapter list is derived from the
# doc's sections on every split, so nobody keeps it in step by hand.
project:
  type: book
  output-dir: _book
  resources:
    - assets/social/cloud-data-mirror.png
    - assets/social/cloud-data-mirror-social.png

book:
  title: "Security Reference Architecture for Cloud Data Mirrors"
  subtitle: "Request for comments"
  author: "AJS Consult LLC. Editor: Aaron Soellinger."
  date: last-modified
  license: "CC BY"
  repo-url: https://github.com/ajs-consult-llc/mirror-encryption-rfc
  repo-actions: [edit, issue, source]
  search: true
  site-url: https://ajs-consult-llc.github.io/mirror-encryption-rfc/
  # Link previews get the white-background version: a transparent PNG looks broken on dark-mode feeds.
  image: assets/social/cloud-data-mirror-social.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  chapters:
    - index.md
    - updates.qmd
    - chapters/01-document-control.md
    - chapters/02-executive-summary.md
    - chapters/03-contents.md
    - chapters/04-what-it-defends-against.md
    - chapters/05-system-requirements.md
    - chapters/06-the-design-on-one-page.md
    - chapters/07-how-it-works.md
    - chapters/08-latency-budget.md
    - chapters/09-what-it-does-not-protect.md
    - chapters/10-decisions-made-to-simplify.md
    - chapters/11-questions-for-reviewers.md
  appendices:
    - chapters/12-appendix-a-single-or-multi-tenant.md

number-sections: false

# The doc has no bibliography, and its byline's "@name" mention is not a citation.
from: markdown-citations

format:
  html:
    theme: cosmo
    mermaid:
      theme: neutral
    toc: true
    toc-depth: 3
