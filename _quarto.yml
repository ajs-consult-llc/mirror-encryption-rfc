# GENERATED: tools/rfcsync.py split writes _quarto.yml from this template.
# Edit this template, never _quarto.yml. The chapter list is derived from the
# doc's sections on every split, so nobody keeps it in step by hand.
project:
  type: book
  output-dir: _book
  resources:
    - assets/social/cloud-data-mirror.png
    - assets/social/cloud-data-mirror-social.png

book:
  title: "Security Reference Architecture for Cloud Data Mirrors"
  subtitle: "Request for comments"
  author: "AJS Consult LLC. Editor: Aaron Soellinger."
  date: last-modified
  license: "CC BY"
  repo-url: https://github.com/ajs-consult-llc/mirror-encryption-rfc
  repo-actions: [edit, issue, source]
  search: true
  site-url: https://ajs-consult-llc.github.io/mirror-encryption-rfc/
  # Link previews get the white-background version: a transparent PNG looks broken on dark-mode feeds.
  image: assets/social/cloud-data-mirror-social.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  # The chapter list is generated from the doc's sections; tools/book_parts.json groups some of
  # them under one heading in the left panel.
  chapters:
    - text: "Home"
      href: index.md
    - part: "About this RFC"
      chapters:
        - updates.qmd
        - chapters/01-document-control.md
    - part: "Contents"
      chapters:
        - chapters/02-contents.md
        - chapters/03-figures.md
    - chapters/04-executive-summary.md
    - chapters/05-what-it-defends-against.md
    - chapters/06-system-requirements.md
    - chapters/07-the-design-on-one-page.md
    - chapters/08-how-it-works.md
    - chapters/09-latency-budget.md
    - chapters/10-what-it-does-not-protect.md
    - chapters/11-decisions-made-to-simplify.md
    - chapters/12-questions-for-reviewers.md
  appendices:
    - chapters/13-appendix-a-single-or-multi-tenant.md
    - chapters/14-appendix-b-the-diagrams-as-text.md

number-sections: false

# Readers comment two ways: Hypothesis (select any text and annotate it; discussion only) and
# giscus (a box at the end of each page, signed in with GitHub and kept as GitHub Discussions in
# this repository; credited). Suggest edits (assets/site/suggest-edits.html) sends wording changes
# as a GitHub issue. CONTRIBUTING.md says what each one counts as.
comments:
  hypothesis: true
  giscus:
    repo: ajs-consult-llc/mirror-encryption-rfc
    repo-id: R_kgDOVq8EvA
    category: General
    category-id: DIC_kwDOVq8EvM4DK7dz
    mapping: pathname
    reactions-enabled: true
    input-position: top
    loading: lazy

# The doc has no bibliography, and its byline's "@name" mention is not a citation.
from: markdown-citations

format:
  html:
    theme: cosmo
    mermaid:
      theme: neutral
    toc: true
    toc-depth: 3
    # The page's sections sit in the left panel, under the chapter, opened out: one place to
    # see where you are, with every subsection (6.1, 6.1.1, ...) listed.
    toc-location: left
    toc-expand: true
    include-after-body: assets/site/suggest-edits.html
    fig-cap-location: top
