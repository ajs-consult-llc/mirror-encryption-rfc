name: Submission
description: An official, attributed comment or objection on the RFC (Appendix A).
title: "[Submission] "
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        This files an official submission, credited to the GitHub account that opens it.
        Do not report a security problem in the running service here: see chapter 17, Vulnerability disclosure.
  - type: input
    id: section
    attributes:
      label: Section
      description: The section or appendix this is about, for example "10. Searching encrypted data".
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: The text you would put in its place, if you have one.
  - type: checkboxes
    id: license
    attributes:
      label: License
      options:
        - label: I license this submission under CC BY 4.0, the document's license.
          required: true
