name: Publish the book

# Renders the Quarto book (HTML, and PDF via Typst) and publishes it to
# the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches: [main]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The chapters join back into one document
        run: python3 tools/rfcsync.py join > /dev/null

      - name: Run the sync tool's tests
        run: python3 -m unittest discover -s tests -v

      - name: Write the landing block and the Updates page
        run: python3 tools/site_pages.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      # The repository keeps ```mermaid, which GitHub draws on its own pages. Quarto draws
      # ```{mermaid}, so the build copy is switched over here and never committed.
      - name: Mermaid blocks become Quarto diagrams
        run: sed -i 's/^```mermaid$/```{mermaid}/' index.md chapters/*.md

      - name: A headless browser, to draw the diagrams in the PDF
        run: quarto install chrome-headless-shell --no-prompt || quarto install chromium --no-prompt

      - name: Render HTML and PDF
        run: quarto render

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
