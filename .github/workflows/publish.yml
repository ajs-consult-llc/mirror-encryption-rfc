name: Publish the book

# Renders the Quarto book as a website and publishes it to
# the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches: [main]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The chapters join back into one document
        run: python3 tools/rfcsync.py join > /dev/null

      - name: Run the sync tool's tests
        run: python3 -m unittest discover -s tests -v

      - name: Write the landing block and the Updates page
        run: python3 tools/site_pages.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      # The repository keeps plain .md with ```mermaid, which GitHub shows and draws on its own
      # pages. Quarto draws only ```{mermaid}, and only in .qmd files, so the build copy is
      # converted here and never committed: fences switched, files renamed, the book list updated.
      - name: The build copy becomes Quarto documents with Quarto diagrams
        run: |
          for f in index.md chapters/*.md; do
            sed -i 's/^```mermaid$/```{mermaid}/' "$f"
            mv "$f" "${f%.md}.qmd"
          done
          sed -i -E 's#^(    - (index|chapters/[^ ]+))\.md$#\1.qmd#' _quarto.yml
          grep -n 'qmd' _quarto.yml

      - name: Render the site
        run: quarto render

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
