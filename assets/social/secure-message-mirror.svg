<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Secure Message Mirror: mail, messages, calendars, contacts, wearables and machines flow, encrypted, into a mirror locked with your key; AI you approve uses it for answers, search, summaries, agents, insights and alerts; everyone else sees ciphertext only">
  <defs>
    <clipPath id="mirror-clip"><rect x="470" y="150" width="260" height="340" rx="28"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2f5f86"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c0533f"/>
    </marker>
    <!-- One tile, reused: a soft circle behind each symbol -->
    <circle id="tile" r="40" fill="#2f5f86" fill-opacity="0.08" stroke="#2f5f86" stroke-opacity="0.35" stroke-width="1.5"/>
  </defs>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" transform="translate(0,-26)">
    <!-- Captions -->
    <text x="215" y="118" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="2" fill="#5f7183">YOUR DATA</text>
    <text x="985" y="118" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="2" fill="#5f7183">AI YOU APPROVE</text>

    <!-- Left: what the mirror holds -->
    <use href="#tile" x="140" y="190"/><use href="#tile" x="290" y="190"/>
    <use href="#tile" x="140" y="330"/><use href="#tile" x="290" y="330"/>
    <use href="#tile" x="140" y="470"/><use href="#tile" x="290" y="470"/>
    <g fill="none" stroke="#1f2933" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Mail -->
      <rect x="122" y="177" width="36" height="26" rx="4"/>
      <polyline points="123,180 140,193 157,180"/>
      <!-- Messages -->
      <rect x="272" y="316" width="36" height="24" rx="7"/>
      <path d="M280 340 v8 l8 -8"/>
      <!-- Calendar -->
      <rect x="122" y="318" width="36" height="30" rx="4"/>
      <line x1="122" y1="328" x2="158" y2="328"/>
      <line x1="131" y1="313" x2="131" y2="322"/>
      <line x1="149" y1="313" x2="149" y2="322"/>
      <!-- Contacts -->
      <circle cx="290" cy="183" r="7"/>
      <path d="M277 205 a13 11 0 0 1 26 0"/>
      <!-- Wearable -->
      <rect x="129" y="457" width="22" height="26" rx="6"/>
      <path d="M133 457 v-8 h14 v8 M133 483 v8 h14 v-8"/>
      <polyline points="133,470 137,470 139,465 142,475 144,470 147,470"/>
      <!-- Machine: a connected factory -->
      <path d="M272 486 V468 l10 -6 v6 l10 -6 v6 l8 -5 V452 h8 v34 Z"/>
      <line x1="270" y1="486" x2="310" y2="486"/>
      <path d="M298 446 a6 6 0 0 1 12 0 M295 442 a9 9 0 0 1 18 0"/>
    </g>
    <g font-size="16" fill="#3a4b5b" text-anchor="middle">
      <text x="140" y="252">Mail</text><text x="290" y="252">Contacts</text>
      <text x="140" y="392">Calendar</text><text x="290" y="392">Messages</text>
      <text x="140" y="532">Wearables</text><text x="290" y="532">Machines</text>
    </g>

    <!-- Into the mirror, encrypted at the source -->
    <text x="392" y="138" text-anchor="middle" font-size="14" fill="#5f7183">encrypted at the source</text>
    <g fill="none" stroke="#2f5f86" stroke-width="2.5">
      <path d="M332 190 C 410 190, 410 270, 466 270" marker-end="url(#arrow)"/>
      <path d="M332 330 C 400 330, 410 320, 466 320" marker-end="url(#arrow)"/>
      <path d="M332 470 C 410 470, 410 370, 466 370" marker-end="url(#arrow)"/>
    </g>

    <!-- The mirror -->
    <rect x="470" y="150" width="260" height="340" rx="28" fill="#2f5f86" fill-opacity="0.07" stroke="#2f5f86" stroke-width="3"/>
    <g clip-path="url(#mirror-clip)" fill="#2f5f86">
      <polygon points="560,150 630,150 500,490 430,490" opacity="0.06"/>
      <polygon points="650,150 672,150 542,490 520,490" opacity="0.05"/>
    </g>
    <path d="M584 232 v-14 a16 16 0 0 1 32 0 v14" fill="none" stroke="#1f2933" stroke-width="6" stroke-linecap="round"/>
    <rect x="572" y="230" width="56" height="42" rx="9" fill="#1f2933"/>
    <circle cx="600" cy="247" r="5.5" fill="#ffffff"/>
    <rect x="597.5" y="247" width="5" height="13" rx="2" fill="#ffffff"/>
    <g fill="none" stroke="#c8932e" stroke-width="6" stroke-linecap="round">
      <circle cx="660" cy="251" r="12"/>
      <line x1="672" y1="251" x2="708" y2="251"/>
      <line x1="700" y1="251" x2="700" y2="262"/>
      <line x1="690" y1="251" x2="690" y2="260"/>
    </g>
    <text x="600" y="306" text-anchor="middle" font-size="17" font-weight="600" fill="#a87a22">Locked with your key</text>
    <g font-family="Menlo, SFMono-Regular, Consolas, monospace" font-size="16" fill="#5f7183" text-anchor="middle">
      <text x="600" y="346">a8f3 9c1e 47b2 d0e5</text>
      <text x="600" y="372">7e21 c4a9 0f6d 3b8e</text>
      <text x="600" y="398">e59c 12af 8d07 64c3</text>
      <text x="600" y="424">0b4e f7a1 29d8 c6e0</text>
    </g>
    <text x="600" y="466" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2933">Your encrypted mirror</text>

    <!-- Out to the AI the user approves, each with its own key -->
    <g fill="none" stroke="#c8932e" stroke-width="3" stroke-linecap="round">
      <circle cx="744" cy="133" r="6"/><line x1="750" y1="133" x2="764" y2="133"/><line x1="760" y1="133" x2="760" y2="139"/>
    </g>
    <text x="772" y="138" font-size="14" fill="#a87a22">each with its own key</text>
    <g fill="none" stroke="#2f5f86" stroke-width="2.5">
      <path d="M734 270 C 790 270, 800 190, 866 190" marker-end="url(#arrow)"/>
      <path d="M734 320 C 800 320, 810 330, 866 330" marker-end="url(#arrow)"/>
      <path d="M734 370 C 790 370, 800 470, 866 470" marker-end="url(#arrow)"/>
    </g>

    <!-- Right: what AI does with it -->
    <use href="#tile" x="910" y="190"/><use href="#tile" x="1060" y="190"/>
    <use href="#tile" x="910" y="330"/><use href="#tile" x="1060" y="330"/>
    <use href="#tile" x="910" y="470"/><use href="#tile" x="1060" y="470"/>
    <g fill="none" stroke="#1f2933" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Answers -->
      <rect x="892" y="176" width="36" height="24" rx="7"/>
      <path d="M900 200 v8 l8 -8"/>
      <!-- Search -->
      <circle cx="1056" cy="186" r="10"/>
      <line x1="1063" y1="193" x2="1073" y2="203"/>
      <!-- Summaries -->
      <rect x="897" y="313" width="26" height="34" rx="3"/>
      <line x1="903" y1="322" x2="917" y2="322"/><line x1="903" y1="329" x2="917" y2="329"/><line x1="903" y1="336" x2="912" y2="336"/>
      <!-- Insights -->
      <line x1="1042" y1="346" x2="1078" y2="346"/>
      <rect x="1046" y="330" width="7" height="13" rx="1"/><rect x="1057" y="322" width="7" height="21" rx="1"/><rect x="1068" y="314" width="7" height="29" rx="1"/>
      <!-- Alerts -->
      <path d="M1048 478 h24 l-3 -5 v-8 a9 9 0 0 0 -18 0 v8 z"/>
      <circle cx="1060" cy="483" r="3"/>
    </g>
    <!-- Answers sparkle and Agents bolt (filled) -->
    <path d="M910 182 C911 186 912 187 916 188 C912 189 911 190 910 194 C909 190 908 189 904 188 C908 187 909 186 910 182 Z" fill="#1f2933"/>
    <path d="M913 452 L901 472 H910 L907 488 L919 468 H910 Z" fill="#1f2933"/>
    <g font-size="16" fill="#3a4b5b" text-anchor="middle">
      <text x="910" y="252">Answers</text><text x="1060" y="252">Search</text>
      <text x="910" y="392">Summaries</text><text x="1060" y="392">Insights</text>
      <text x="910" y="532">Agents</text><text x="1060" y="532">Alerts</text>
    </g>

    <!-- Everyone else -->
    <path d="M600 494 V 556" fill="none" stroke="#c0533f" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    <circle cx="600" cy="584" r="13" fill="none" stroke="#c0533f" stroke-width="2.5"/>
    <line x1="591" y1="575" x2="609" y2="593" stroke="#c0533f" stroke-width="2.5" stroke-linecap="round"/>
    <text x="624" y="590" font-size="16" fill="#c0533f">Everyone else sees ciphertext only</text>
  </g>
</svg>
